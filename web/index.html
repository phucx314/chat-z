<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">

    <!-- ── Sidebar ─────────────────────────────────────────────────────────── -->
    <aside id="sidebar">
      <div id="sidebar-top">
        <h1 id="sidebar-title">Chats</h1>
        <button id="new-chat-btn" title="New Chat">✎</button>
      </div>

      <div id="search-wrap">
        <input type="text" id="search-input" placeholder="🔍  Search Messenger" />
      </div>

      <div id="conv-list"></div>

      <div id="sidebar-bottom">
        <button id="settings-btn">⚙  Settings</button>
      </div>
    </aside>

    <!-- ── Main Chat ───────────────────────────────────────────────────────── -->
    <main id="chat-main">

      <!-- Header -->
      <header id="chat-header">
        <div id="header-avatar"></div>
        <div id="header-info">
          <div id="header-title">AI Assistant</div>
          <div id="header-status">● Active Now</div>
        </div>
        <div id="header-model-badge"></div>
      </header>

      <!-- Messages -->
      <div id="chat-messages"></div>

      <!-- Input -->
      <div id="input-area">
        <div id="input-pill">
          <button id="model-btn">⚡ Loading… ▾</button>
          <div id="input-divider"></div>
          <textarea id="msg-input" placeholder="Type a message..." rows="1"></textarea>
          <button id="send-btn">➤</button>
        </div>
        <div id="input-hint">Enter to send · Shift+Enter for new line</div>
      </div>
    </main>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-box">
      <h2>Settings</h2>
      <label>Provider</label>
      <select id="cfg-provider"></select>
      <label>API Key</label>
      <input type="password" id="cfg-apikey" placeholder="Enter API key (leave blank to use .env)" />
      <div id="cfg-env-indicator"></div>
      <label>Base URL</label>
      <input type="text" id="cfg-baseurl" />
      <div class="modal-actions">
        <button class="btn-cancel" id="settings-cancel">Cancel</button>
        <button class="btn-primary" id="settings-save">Save</button>
      </div>
    </div>
  </div>

  <!-- Rename Modal -->
  <div id="rename-modal" class="modal hidden">
    <div class="modal-box">
      <h2>Rename Chat</h2>
      <input type="text" id="rename-input" placeholder="Enter new name..." />
      <div class="modal-actions">
        <button class="btn-cancel" id="rename-cancel">Cancel</button>
        <button class="btn-primary" id="rename-save">Save</button>
      </div>
    </div>
  </div>

  <!-- Color picker modal -->
  <div id="color-modal" class="modal hidden">
    <div class="modal-box">
      <h2>Choose Avatar Color</h2>
      <div id="color-grid"></div>
      <div class="modal-actions">
        <button class="btn-cancel" id="color-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Model picker dropdown -->
  <div id="model-menu" class="dropdown hidden"></div>

  <script src="app.js"></script>
</body>
</html>
